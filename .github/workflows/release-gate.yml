name: Release Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version/build files and metadata sync
        run: scripts/ci/check-version-consistency.sh

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CHECK_TAG_MATCH: "1"
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: scripts/ci/check-version-consistency.sh

  release-notes-reminder:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [version-consistency]
    steps:
      - name: Release checklist
        run: |
          echo "Tag validated."
          echo "Recommended next steps:"
          echo "1) Create GitHub Release for $GITHUB_REF_NAME"
          echo "2) Include changelog and migration notes"
          echo "3) Attach artifact hashes/signatures if available"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
